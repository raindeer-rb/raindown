name: release

# Builds a standalone raindown executable per platform with tebako and attaches them to the GitHub release.
# Tebako can't cross-compile, so every platform builds on its own runner.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  TEBAKO_VERSION: '2.8.45'

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-latest, tebako: macos-arm64 }
          - { platform: macos-x86_64, runner: macos-15-intel, tebako: macos-x86_64 }
          - { platform: linux-x86_64, runner: ubuntu-latest, tebako: linux-gnu-x86_64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, tebako: linux-gnu-arm64 }
          - { platform: linux-musl-x86_64, runner: ubuntu-latest, tebako: linux-musl-x86_64, alpine: true }
          - { platform: linux-musl-arm64, runner: ubuntu-24.04-arm, tebako: linux-musl-arm64, alpine: true }
          - { platform: windows-x86_64, runner: windows-latest, tebako: windows-ucrt64, exe: .exe }
    env:
      TEBAKO_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tebako (sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          asset="tebako-$TEBAKO_VERSION-${{ matrix.tebako }}${{ matrix.exe }}"
          base="https://github.com/tamatebako/tebako/releases/download/v$TEBAKO_VERSION"
          mkdir -p .tools && cd .tools
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$asset"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/SHA256SUMS"
          grep " $asset\$" SHA256SUMS > expected
          if command -v sha256sum > /dev/null; then sha256sum -c expected; else shasum -a 256 -c expected; fi
          mv "$asset" "tebako${{ matrix.exe }}"
          chmod +x "tebako${{ matrix.exe }}"

      # The curses gem compiles against ncurses, whose headers Ubuntu doesn't install by default.
      - name: Install ncurses
        if: ${{ runner.os == 'Linux' && !matrix.alpine }}
        run: sudo apt-get update -q && sudo apt-get install -y -q libncurses-dev

      - uses: ruby/setup-ruby@v1
        if: ${{ !matrix.alpine }}
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build
        if: ${{ !matrix.alpine }}
        shell: bash
        run: bundle exec rake tebako TEBAKO="$PWD/.tools/tebako${{ matrix.exe }}"

      # musl builds run in Alpine, which JavaScript actions like checkout can't run inside on arm64.
      - name: Build (Alpine)
        if: ${{ matrix.alpine }}
        run: |
          # Ruby's configure, which tebako runs to build native extensions, needs bash, not busybox's sh.
          docker run --rm -v "$PWD:/work" -w /work -e TEBAKO_PLATFORM -e CONFIG_SHELL=/bin/bash alpine:3.22 sh -euc '
            apk add --no-cache bash build-base curl git linux-headers ncurses-dev openssl-dev ruby ruby-dev yaml-dev
            git config --global --add safe.directory /work
            gem install bundler --no-document
            bundle install
            bundle exec rake tebako TEBAKO=/work/.tools/tebako
          '

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="pkg/raindown-*-$TEBAKO_PLATFORM${{ matrix.exe }}"
          # Commonmarker's musl extension needs libgcc, and curses' needs ncurses, which bare Alpine doesn't include.
          run() {
            if [ "${{ matrix.alpine }}" = "true" ]; then
              docker run --rm -v "$PWD:/work" -w /work alpine:3.22 sh -c 'apk add --no-cache -q libgcc ncurses-libs && exec "$@"' sh $bin "$@"
            else
              $bin "$@"
            fi
          }
          # Help prints the usage and exits with an error.
          help=$(run -h 2>&1 || true)
          echo "$help"
          grep -q 'Usage: raindown' <<< "$help"
          run examples/markdown.md --html out.html
          grep 'Table of contents' out.html
          # Without a terminal it says so once curses has loaded, which shows its extension was packaged, then watches.
          # It runs in a subshell, as run is a function, so the subshell's children are stopped with it.
          run examples < /dev/null > tui.log 2>&1 &
          pid=$!
          for _ in $(seq 60); do grep -q 'needs a terminal' tui.log && break; sleep 1; done
          pkill -P "$pid" 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
          cat tui.log
          grep -q 'needs a terminal' tui.log

      - uses: actions/upload-artifact@v4
        with:
          name: raindown-${{ matrix.platform }}
          path: pkg/raindown-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # Drop the version so releases/latest/download/raindown-<platform> links stay stable.
          for f in dist/raindown-*; do mv "$f" "dist/raindown-${f#dist/raindown-*-}"; done
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --generate-notes
          gh release upload "$tag" dist/* --clobber
